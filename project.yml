name: TeddyFinder
options:
  bundleIdPrefix: kr.ai
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
targets:
  TeddyFinder:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TeddyFinder
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]   # 문자열 번역: Sources/*.xcstrings
        NSCameraUsageDescription: TeddyFinder uses the camera to find things around you.
        # 시작 화면: 복숭아 배경 + 곰 얼굴(170pt). 앱이 뜨면 SplashView가 같은 자리에서 이어받아 애니메이션.
        UILaunchScreen: {UIColorName: LaunchBackground, UIImageName: splash_bear}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false   # 암호화 안 씀 → 업로드마다 수출 규정 질문 생략
        LSApplicationCategoryType: public.app-category.utilities
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: kr.ai.teddyfinder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A2GZT35P4Y   # Xcode에서 고른 팀. xcodegen 재생성해도 유지되도록 여기 고정
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
